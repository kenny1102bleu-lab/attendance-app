name: Discord Monitor
on:
  schedule:
    - cron: '*/10 * * * *'   # 10分ごと（Make.comの15分より高頻度・無料）
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install node-fetch
      - name: Run Discord Monitor (Make.com代替)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
        run: node scripts/discord_monitor.mjs
