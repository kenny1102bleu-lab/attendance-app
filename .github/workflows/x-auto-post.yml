name: X Auto Post

on:
  schedule:
    - cron: '0 3 * * *'   # すなくん Amazon（12:00 JST）
    - cron: '0 9 * * *'   # すなくん 楽天（18:00 JST）
    - cron: '0 1 * * *'   # HAL 投稿（10:00 JST）
    - cron: '0 6 * * *'   # HAL 午後（15:00 JST）
  workflow_dispatch:
    inputs:
      account:
        description: 'アカウント'
        required: true
        default: 'sunakun'
        type: choice
        options:
          - sunakun
          - hal

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install agent-twitter-client
        run: npm install agent-twitter-client

      # アカウントとGASアクションを決定
      - name: Determine params
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACCOUNT="${{ github.event.inputs.account }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "01" ] || [ "$HOUR" = "06" ]; then
              ACCOUNT="hal"
            else
              ACCOUNT="sunakun"
            fi
          fi

          # GASには投稿文生成のみ依頼（X投稿はGitHub Actions側で行う）
          if [ "$ACCOUNT" = "hal" ]; then
            GAS_ACTION="generate_hal_post"
          else
            GAS_ACTION="generate_sunakun_post"
          fi

          echo "account=$ACCOUNT" >> $GITHUB_OUTPUT
          echo "gas_action=$GAS_ACTION" >> $GITHUB_OUTPUT
          echo "== $ACCOUNT / $GAS_ACTION =="

      # GAS に投稿文生成を依頼
      - name: Generate tweet via GAS
        id: generate
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          GAS_ACTION="${{ steps.params.outputs.gas_action }}"
          echo "GASアクション: $GAS_ACTION"

          RESPONSE=$(curl -s -L --max-time 120 \
            --data "{\"action\":\"${GAS_ACTION}\",\"platform\":\"X\"}" \
            -H "Content-Type: application/json" \
            "${GAS_URL}")

          echo "GAS応答(先頭300): ${RESPONSE:0:300}"

          # テキスト抽出
          TWEET_TEXT=$(echo "$RESPONSE" | node scripts/extract_tweet.mjs 2>/dev/null || echo "")

          if [ -z "$TWEET_TEXT" ]; then
            echo "⚠️ テキスト抽出失敗"
            echo "has_text=false" >> $GITHUB_OUTPUT
          else
            echo "取得: $TWEET_TEXT"
            echo "has_text=true" >> $GITHUB_OUTPUT
            echo "text<<TWEET_EOF" >> $GITHUB_OUTPUT
            echo "$TWEET_TEXT" >> $GITHUB_OUTPUT
            echo "TWEET_EOF" >> $GITHUB_OUTPUT
          fi

      # agent-twitter-client でX投稿（APIクレジット不要）
      - name: Post to X
        id: post
        if: steps.generate.outputs.has_text == 'true'
        env:
          SUNAKUN_X_USERNAME: ${{ secrets.SUNAKUN_X_USERNAME }}
          SUNAKUN_X_PASSWORD: ${{ secrets.SUNAKUN_X_PASSWORD }}
          HAL_X_USERNAME: ${{ secrets.HAL_X_USERNAME }}
          HAL_X_PASSWORD: ${{ secrets.HAL_X_PASSWORD }}
          X_ACCOUNT: ${{ steps.params.outputs.account }}
          TWEET_TEXT: ${{ steps.generate.outputs.text }}
        run: node scripts/x_post.mjs

      # 結果をGASに報告 → Discord通知
      - name: Report to GAS
        if: always() && steps.generate.outputs.has_text == 'true'
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          ACCOUNT="${{ steps.params.outputs.account }}"
          SUCCESS="${{ steps.post.outputs.success || 'false' }}"
          TWEET_ID="${{ steps.post.outputs.tweet_id || '' }}"
          curl -s -L --max-time 30 \
            --data "{\"action\":\"report_x_post_result\",\"account\":\"${ACCOUNT}\",\"success\":${SUCCESS},\"tweetId\":\"${TWEET_ID}\",\"text\":\"\"}" \
            -H "Content-Type: application/json" \
            "${GAS_URL}" || echo "GAS報告スキップ"
