name: X Auto Post

on:
  schedule:
    # すなくん Amazon投稿（毎日 12:00 JST = 03:00 UTC）
    - cron: '0 3 * * *'
    # すなくん 楽天投稿（毎日 18:00 JST = 09:00 UTC）
    - cron: '0 9 * * *'
    # HAL 投稿（毎日 10:00 JST = 01:00 UTC）
    - cron: '0 1 * * *'
    # HAL 午後投稿（毎日 15:00 JST = 06:00 UTC）
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 'アカウント (sunakun / hal)'
        required: true
        default: 'sunakun'
        type: choice
        options:
          - sunakun
          - hal

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install twitter-api-v2

      # スケジュール時間でアカウントを自動判定
      - name: Determine account and action
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACCOUNT="${{ github.event.inputs.account }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "01" ] || [ "$HOUR" = "06" ]; then
              ACCOUNT="hal"
            else
              ACCOUNT="sunakun"
            fi
          fi

          # GASアクション名を決定
          HOUR=$(date -u +%H)
          if [ "$ACCOUNT" = "hal" ]; then
            GAS_ACTION="generate_hal_post"
          elif [ "$HOUR" = "03" ]; then
            GAS_ACTION="auto_post_affiliate_amazon"
          else
            GAS_ACTION="auto_post_affiliate_rakuten"
          fi

          echo "account=$ACCOUNT" >> $GITHUB_OUTPUT
          echo "gas_action=$GAS_ACTION" >> $GITHUB_OUTPUT
          echo "アカウント: $ACCOUNT / GASアクション: $GAS_ACTION"

      # GAS に投稿文生成をリクエストし、テキストを取得
      - name: Generate tweet via GAS
        id: generate
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          ACCOUNT="${{ steps.params.outputs.account }}"
          GAS_ACTION="${{ steps.params.outputs.gas_action }}"

          echo "GASに投稿文生成リクエスト中... (action=$GAS_ACTION)"

          # GAS POST リクエスト（-L でリダイレクト追跡）
          RESPONSE=$(curl -s -L --max-time 60 \
            --data "{\"action\":\"${GAS_ACTION}\"}" \
            -H "Content-Type: application/json" \
            "${GAS_URL}")

          echo "GAS レスポンス(先頭200文字): ${RESPONSE:0:200}"

          # レスポンスからツイートテキストを抽出（Node.jsで解析）
          TWEET_TEXT=$(echo "$RESPONSE" | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const j=JSON.parse(d);
                // 各アクションのレスポンス形式に対応
                let text = '';
                if (j.xResult && j.xResult.text) {
                  text = j.xResult.text;
                } else if (j.post && j.post.post) {
                  // generateSunakkunPost 形式
                  const p = j.post;
                  text = p.post + (p.hashtags && p.hashtags.length > 0 ? '\n\n' + p.hashtags.join(' ') : '');
                } else if (j.patterns && j.patterns.pattern1) {
                  // generateHALPost 形式
                  const pat = j.patterns;
                  text = pat.pattern1 + (pat.hashtags && pat.hashtags.length > 0 ? '\n\n' + pat.hashtags.join(' ') : '');
                } else if (j.result && j.result.post && j.result.post.post) {
                  // autoPostAffiliate 形式
                  const rp = j.result.post;
                  text = rp.post + (rp.hashtags && rp.hashtags.length > 0 ? '\n\n' + rp.hashtags.join(' ') : '');
                }
                process.stdout.write(text || '');
              } catch(e) {
                process.stdout.write('');
              }
            });
          " 2>/dev/null || echo "")

          if [ -z "$TWEET_TEXT" ]; then
            echo "警告: GASからツイートテキストを取得できませんでした"
            echo "has_text=false" >> $GITHUB_OUTPUT
          else
            echo "取得したツイートテキスト:"
            echo "$TWEET_TEXT"
            echo "has_text=true" >> $GITHUB_OUTPUT
            echo "text<<TWEET_EOF" >> $GITHUB_OUTPUT
            echo "$TWEET_TEXT" >> $GITHUB_OUTPUT
            echo "TWEET_EOF" >> $GITHUB_OUTPUT
          fi

      # X に投稿
      - name: Post to X
        id: post
        if: steps.generate.outputs.has_text == 'true'
        env:
          X_CONSUMER_KEY:     ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET:  ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN:     ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:    ${{ secrets.X_ACCESS_SECRET }}
          HAL_X_CONSUMER_KEY:     ${{ secrets.HAL_X_CONSUMER_KEY }}
          HAL_X_CONSUMER_SECRET:  ${{ secrets.HAL_X_CONSUMER_SECRET }}
          HAL_X_ACCESS_TOKEN:     ${{ secrets.HAL_X_ACCESS_TOKEN }}
          HAL_X_ACCESS_SECRET:    ${{ secrets.HAL_X_ACCESS_SECRET }}
          X_ACCOUNT:   ${{ steps.params.outputs.account }}
          TWEET_TEXT:  ${{ steps.generate.outputs.text }}
        run: node scripts/x_post.mjs

      # 結果をGASに報告してDiscord通知
      - name: Report result to GAS
        if: always() && steps.generate.outputs.has_text == 'true'
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          ACCOUNT="${{ steps.params.outputs.account }}"
          OUTCOME="${{ steps.post.outcome }}"
          TWEET_ID="${{ steps.post.outputs.tweet_id }}"

          if [ "$OUTCOME" = "success" ]; then
            SUCCESS="true"
          else
            SUCCESS="false"
          fi

          curl -s -L --max-time 30 \
            --data "{\"action\":\"report_x_post_result\",\"account\":\"${ACCOUNT}\",\"success\":${SUCCESS},\"tweetId\":\"${TWEET_ID}\"}" \
            -H "Content-Type: application/json" \
            "${GAS_URL}" || echo "GAS報告失敗（無視）"
