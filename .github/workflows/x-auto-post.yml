name: X Auto Post

on:
  schedule:
    - cron: '0 1 * * *'   # HAL 投稿（10:00 JST）
    - cron: '0 6 * * *'   # HAL 午後（15:00 JST）
  workflow_dispatch:
    inputs:
      account:
        description: 'アカウント'
        required: true
        default: 'hal'
        type: choice
        options:
          - hal

# すなくんはGASタイマートリガー(12時Amazon/18時楽天)で自律投稿するためここでは扱わない。
# HALのみGitHub Actions → GAS webhook → 生成+OAuth1.0a投稿の一体フロー。

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - name: Determine account
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACCOUNT="${{ github.event.inputs.account }}"
          else
            ACCOUNT="hal"
          fi
          echo "account=$ACCOUNT" >> $GITHUB_OUTPUT
          echo "== $ACCOUNT =="

      # GASに生成+投稿を一体で依頼（agent-twitter-client廃止・GAS OAuth1.0a直接投稿）
      - name: Generate and post via GAS
        id: gas
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          ACCOUNT="${{ steps.params.outputs.account }}"
          echo "GASに auto_post_${ACCOUNT} を依頼..."

          RESPONSE=$(curl -s -L --max-time 180 \
            --data "{\"action\":\"auto_post_${ACCOUNT}\",\"platform\":\"X\"}" \
            -H "Content-Type: application/json" \
            "${GAS_URL}")

          echo "GAS応答(先頭500): ${RESPONSE:0:500}"

          # 成功判定
          OK=$(echo "$RESPONSE" | grep -o '"ok":true' || echo "")
          if [ -n "$OK" ]; then
            echo "✅ GAS投稿成功"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ GAS投稿失敗またはタイムアウト"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # 結果をDiscordに報告（GAS側でも通知するが二重確認）
      - name: Report result to GAS
        if: always()
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          ACCOUNT="${{ steps.params.outputs.account }}"
          SUCCESS="${{ steps.gas.outputs.success || 'false' }}"
          curl -s -L --max-time 30 \
            --data "{\"action\":\"report_x_post_result\",\"account\":\"${ACCOUNT}\",\"success\":${SUCCESS},\"source\":\"github_actions\"}" \
            -H "Content-Type: application/json" \
            "${GAS_URL}" || echo "GAS報告スキップ"
