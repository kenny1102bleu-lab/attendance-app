name: X Auto Post

on:
  schedule:
    # すなくん Amazon投稿（毎日 12:00 JST = 03:00 UTC）
    - cron: '0 3 * * *'
    # すなくん 楽天投稿（毎日 18:00 JST = 09:00 UTC）
    - cron: '0 9 * * *'
    # HAL 投稿（毎日 10:00 JST = 01:00 UTC）
    - cron: '0 1 * * *'
    # HAL 午後投稿（毎日 15:00 JST = 06:00 UTC）
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 'アカウント (sunakun / hal)'
        required: true
        default: 'sunakun'
        type: choice
        options:
          - sunakun
          - hal

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install twitter-api-v2

      # スケジュール時間でアカウントを自動判定
      - name: Determine account and action
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACCOUNT="${{ github.event.inputs.account }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "01" ] || [ "$HOUR" = "06" ]; then
              ACCOUNT="hal"
            else
              ACCOUNT="sunakun"
            fi
          fi

              # GASアクション名とテーマを決定（7曜日ローテーション）
          HOUR=$(date -u +%H)
          DOW=$(date -u +%u)  # 1=月 7=日
          if [ "$ACCOUNT" = "hal" ]; then
            GAS_ACTION="generate_hal_post"
            THEMES=("コーデ紹介" "MIMOMIタイアップ" "台湾ネタ日常" "推し活・K-POP" "美容・スキンケア" "モデル日常" "週末の過ごし方")
            THEME="${THEMES[$(( (DOW - 1) % 7 ))]}"
          else
            GAS_ACTION="generate_sunakun_post"
            THEMES=("便利ガジェット" "パソコン周辺機器" "ワイヤレスイヤホン" "スマート家電" "モバイルバッテリー充電器" "キーボードデスク環境" "健康グッズ睡眠")
            THEME="${THEMES[$(( (DOW - 1) % 7 ))]}"
          fi

          echo "account=$ACCOUNT" >> $GITHUB_OUTPUT
          echo "gas_action=$GAS_ACTION" >> $GITHUB_OUTPUT
          echo "theme=$THEME" >> $GITHUB_OUTPUT
          echo "アカウント: $ACCOUNT / GASアクション: $GAS_ACTION / テーマ: $THEME"

      # GAS に投稿文生成をリクエストし、テキストを取得
      - name: Generate tweet via GAS
        id: generate
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          ACCOUNT="${{ steps.params.outputs.account }}"
          GAS_ACTION="${{ steps.params.outputs.gas_action }}"

          echo "GASに投稿文生成リクエスト中... (action=$GAS_ACTION)"

          THEME="${{ steps.params.outputs.theme }}"
          echo "テーマ: $THEME"

          # GAS POST リクエスト（-L でリダイレクト追跡）
          RESPONSE=$(curl -s -L --max-time 60 \
            --data "{\"action\":\"${GAS_ACTION}\",\"theme\":\"${THEME}\",\"platform\":\"X\"}" \
            -H "Content-Type: application/json" \
            "${GAS_URL}")

          echo "GAS レスポンス(先頭200文字): ${RESPONSE:0:200}"

          # レスポンスからツイートテキストを抽出（外部スクリプト使用・シェルクォート問題回避）
          TWEET_TEXT=$(echo "$RESPONSE" | node scripts/extract_tweet.mjs 2>/dev/null || echo "")

          if [ -z "$TWEET_TEXT" ]; then
            echo "警告: GASからツイートテキストを取得できませんでした"
            echo "has_text=false" >> $GITHUB_OUTPUT
          else
            echo "取得したツイートテキスト:"
            echo "$TWEET_TEXT"
            echo "has_text=true" >> $GITHUB_OUTPUT
            echo "text<<TWEET_EOF" >> $GITHUB_OUTPUT
            echo "$TWEET_TEXT" >> $GITHUB_OUTPUT
            echo "TWEET_EOF" >> $GITHUB_OUTPUT
          fi

      # GAS から OAuth2 Bearer Token を取得
      - name: Get OAuth2 token from GAS
        id: oauth
        if: steps.generate.outputs.has_text == 'true'
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          ACCOUNT="${{ steps.params.outputs.account }}"
          RESPONSE=$(curl -s -L --max-time 15 "${GAS_URL}?action=getXOAuthToken&account=${ACCOUNT}")
          echo "OAuth response: ${RESPONSE:0:100}"
          TOKEN=$(echo "$RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);process.stdout.write(j.token||'')}catch(e){process.stdout.write('')}})" 2>/dev/null || echo "")
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "token=$TOKEN" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "OAuth2トークン取得失敗 (再認証が必要な可能性があります)"
          fi

      # X に投稿（OAuth2 Bearer Token方式）
      - name: Post to X
        id: post
        if: steps.generate.outputs.has_text == 'true'
        env:
          X_OAUTH2_TOKEN: ${{ steps.oauth.outputs.token }}
          # OAuth 1.0a フォールバック用
          X_CONSUMER_KEY:     ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET:  ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN:     ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:    ${{ secrets.X_ACCESS_SECRET }}
          HAL_X_CONSUMER_KEY:     ${{ secrets.HAL_X_CONSUMER_KEY }}
          HAL_X_CONSUMER_SECRET:  ${{ secrets.HAL_X_CONSUMER_SECRET }}
          HAL_X_ACCESS_TOKEN:     ${{ secrets.HAL_X_ACCESS_TOKEN }}
          HAL_X_ACCESS_SECRET:    ${{ secrets.HAL_X_ACCESS_SECRET }}
          X_ACCOUNT:   ${{ steps.params.outputs.account }}
          TWEET_TEXT:  ${{ steps.generate.outputs.text }}
        run: node scripts/x_post.mjs

      # 結果をGASに報告してDiscord通知
      - name: Report result to GAS
        if: always() && steps.generate.outputs.has_text == 'true'
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          ACCOUNT="${{ steps.params.outputs.account }}"
          OUTCOME="${{ steps.post.outcome }}"
          TWEET_ID="${{ steps.post.outputs.tweet_id }}"

          if [ "$OUTCOME" = "success" ]; then
            SUCCESS="true"
          else
            SUCCESS="false"
          fi

          curl -s -L --max-time 30 \
            --data "{\"action\":\"report_x_post_result\",\"account\":\"${ACCOUNT}\",\"success\":${SUCCESS},\"tweetId\":\"${TWEET_ID}\"}" \
            -H "Content-Type: application/json" \
            "${GAS_URL}" || echo "GAS報告失敗（無視）"
