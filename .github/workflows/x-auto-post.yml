name: X Auto Post

on:
  schedule:
    # すなくん Amazon投稿（毎日 12:00 JST = 03:00 UTC）
    - cron: '0 3 * * *'
    # すなくん 楽天投稿（毎日 18:00 JST = 09:00 UTC）
    - cron: '0 9 * * *'
    # HAL 投稿（毎日 10:00 JST = 01:00 UTC）
    - cron: '0 1 * * *'
    # HAL 午後投稿（毎日 15:00 JST = 06:00 UTC）
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 'アカウント (sunakun / hal)'
        required: true
        default: 'sunakun'
        type: choice
        options:
          - sunakun
          - hal
      action_override:
        description: 'GASアクション上書き（空白=自動判定）'
        required: false
        default: ''

jobs:
  trigger-gas-post:
    runs-on: ubuntu-latest
    steps:
      - name: Determine GAS action
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACCOUNT="${{ github.event.inputs.account }}"
            OVERRIDE="${{ github.event.inputs.action_override }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "01" ] || [ "$HOUR" = "06" ]; then
              ACCOUNT="hal"
            else
              ACCOUNT="sunakun"
            fi
            OVERRIDE=""
          fi

          if [ -n "$OVERRIDE" ]; then
            GAS_ACTION="$OVERRIDE"
          elif [ "$ACCOUNT" = "hal" ]; then
            GAS_ACTION="auto_post_hal"
          else
            # UTC 03時 = JST 12時 → Amazon / UTC 09時 = JST 18時 → 楽天
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "03" ]; then
              GAS_ACTION="auto_post_affiliate_amazon"
            else
              GAS_ACTION="auto_post_affiliate_rakuten"
            fi
          fi

          echo "account=$ACCOUNT" >> $GITHUB_OUTPUT
          echo "gas_action=$GAS_ACTION" >> $GITHUB_OUTPUT
          echo "アカウント: $ACCOUNT / GASアクション: $GAS_ACTION"

      # GAS に投稿を命令（GASが内部でOAuth2使ってX投稿する）
      - name: Trigger GAS to post
        id: gas_post
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          GAS_ACTION="${{ steps.params.outputs.gas_action }}"
          echo "GASアクション実行: $GAS_ACTION"

          RESPONSE=$(curl -s -L --max-time 120 \
            --data "{\"action\":\"${GAS_ACTION}\"}" \
            -H "Content-Type: application/json" \
            "${GAS_URL}")

          echo "GAS応答(先頭300文字): ${RESPONSE:0:300}"

          # 成功判定
          SUCCESS=$(echo "$RESPONSE" | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const j=JSON.parse(d);
                const ok = j.ok===true || j.status==='ok' ||
                           (j.xResult && j.xResult.ok) ||
                           (j.result && j.result.xResult && j.result.xResult.ok);
                process.stdout.write(String(ok));
              } catch(e){ process.stdout.write('false'); }
            });
          " 2>/dev/null || echo "false")

          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "投稿結果: $SUCCESS"

          if [ "$SUCCESS" = "true" ]; then
            echo "✅ GAS経由X投稿成功"
          else
            echo "⚠️ GAS経由X投稿失敗またはX APIエラー（Discordに詳細通知済み）"
            # X APIの問題はGAS側がDiscordに通知済みのため、ここでは失敗扱いにしない
            echo "success=partial" >> $GITHUB_OUTPUT
          fi

      # 投稿完了をGitHub Actions Summaryに記録
      - name: Post summary
        if: always()
        run: |
          ACCOUNT="${{ steps.params.outputs.account }}"
          GAS_ACTION="${{ steps.params.outputs.gas_action }}"
          SUCCESS="${{ steps.gas_post.outputs.success }}"
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')

          echo "## X自動投稿レポート" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 実行時刻 | $NOW |" >> $GITHUB_STEP_SUMMARY
          echo "| アカウント | $ACCOUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| GASアクション | $GAS_ACTION |" >> $GITHUB_STEP_SUMMARY
          echo "| 結果 | $SUCCESS |" >> $GITHUB_STEP_SUMMARY
