name: Daily Report (backup - manual only)

on:
  # cron削除: GASトリガー(毎晩20時)が主系統
  workflow_dispatch:

jobs:
  run-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Call GAS Webhook for Daily Report
        run: |
          curl -L -X POST ${{ secrets.GAS_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{"action": "daily_report", "source": "github-actions"}'
