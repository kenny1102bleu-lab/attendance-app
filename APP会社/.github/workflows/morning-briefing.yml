name: Morning Briefing (backup - manual only)

on:
  # cron削除: GASトリガー(毎朝8時)が主系統
  workflow_dispatch:

jobs:
  run-morning-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Call GAS Webhook for Morning Briefing
        run: |
          curl -L -X POST ${{ secrets.GAS_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{"action": "morning_briefing", "source": "github-actions"}'
