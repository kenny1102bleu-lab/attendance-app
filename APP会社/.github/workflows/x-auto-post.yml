name: X Auto Post

on:
  schedule:
    # すなくん Amazon投稿（毎日 12:00 JST = 03:00 UTC）
    - cron: '0 3 * * *'
    # すなくん 楽天投稿（毎日 18:00 JST = 09:00 UTC）
    - cron: '0 9 * * *'
    # HAL 投稿（毎日 10:00 JST = 01:00 UTC）
    - cron: '0 1 * * *'
    # HAL 午後投稿（毎日 15:00 JST = 06:00 UTC）
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'GASアクション'
        required: true
        default: 'auto_post_affiliate_amazon'
        type: choice
        options:
          - auto_post_affiliate_amazon
          - auto_post_affiliate_rakuten
          - auto_post_hal

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - name: Determine GAS action
        id: action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            case "$HOUR" in
              01) echo "name=auto_post_hal" >> $GITHUB_OUTPUT ;;
              06) echo "name=auto_post_hal" >> $GITHUB_OUTPUT ;;
              03) echo "name=auto_post_affiliate_amazon" >> $GITHUB_OUTPUT ;;
              09) echo "name=auto_post_affiliate_rakuten" >> $GITHUB_OUTPUT ;;
              *)  echo "name=auto_post_hal" >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Call GAS auto-post
        env:
          GAS_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          ACTION="${{ steps.action.outputs.name }}"
          echo "実行アクション: $ACTION"
          RESPONSE=$(curl -s -L --max-time 120 -X POST "${GAS_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"${ACTION}\",\"source\":\"github-actions\"}")
          echo "GAS応答: $RESPONSE"
          OK=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok',''))" 2>/dev/null || echo "")
          if [ "$OK" != "True" ] && [ "$OK" != "true" ]; then
            echo "::warning::GAS returned non-ok response"
          fi
